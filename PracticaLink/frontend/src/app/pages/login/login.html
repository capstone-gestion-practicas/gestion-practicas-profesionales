<p>login works!</p>
<ion-content class="login-content">
  <div class="login-wrapper">

    <ion-card class="login-card">

      <ion-card-header>
        <ion-card-title>PracticaLink</ion-card-title>
      </ion-card-header>

      <ion-card-content>

        <p class="subtitle">
          Gestión de prácticas profesionales
        </p>

        <ion-item>
          <ion-label position="stacked">Correo</ion-label>
          <ion-input
            type="email"
            [(ngModel)]="correo"
            placeholder="correo@ejemplo.cl">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input
            type="password"
            [(ngModel)]="password">
          </ion-input>
        </ion-item>

        @if (error) {
          <p class="error">
            {{ error }}
          </p>
        }

        <ion-button
          expand="block"
          class="login-button"
          [disabled]="cargando || !correo || !password"
          (click)="iniciarSesion()">

          @if (cargando) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Iniciar sesión
          }

        </ion-button>

      </ion-card-content>

    </ion-card>

  </div>
</ion-content>
