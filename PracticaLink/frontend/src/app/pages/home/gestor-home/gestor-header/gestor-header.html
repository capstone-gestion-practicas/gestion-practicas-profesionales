<div class="gh-shell">
  <aside id="gh-sidebar" class="gh-sidebar" [class.gh-sidebar--abierto]="menuMovilAbierto()" aria-label="Navegación de gestión">
    <a class="gh-sidebar__marca" routerLink="/home" (click)="cerrarMenuMovil()" aria-label="PracticaLink, inicio">
      <app-brand-mark variante="completa" tono="claro" />
    </a>
    <p class="gh-sidebar__etiqueta">Espacio de gestión</p>

    <nav aria-label="Accesos de gestión">
      <!-- Cuatro agrupaciones; cada destino conserva su URL. aria-current="page" marca el destino
           concreto y gh-nav__grupo--activo su agrupación (incluidas las rutas hijas). -->
      <ul class="gh-nav">
        <li class="gh-nav__grupo" data-grupo="inicio" [class.gh-nav__grupo--activo]="grupoActivo() === 'inicio'">
          <ul class="gh-nav">
            <li class="gh-nav__item">
              <button type="button" class="gh-nav__enlace" [attr.aria-current]="seccionActiva() === 'inicio' ? 'page' : null" (click)="irA('/home')"><ion-icon name="home-outline" aria-hidden="true"></ion-icon><span>Inicio</span></button>
            </li>
          </ul>
        </li>

        <li class="gh-nav__grupo" data-grupo="practicas" [class.gh-nav__grupo--activo]="grupoActivo() === 'practicas'">
          <span class="gh-nav__titulo" id="gh-grupo-practicas">Prácticas</span>
          <ul class="gh-nav" aria-labelledby="gh-grupo-practicas">
            <li class="gh-nav__item">
              <button type="button" class="gh-nav__enlace" [attr.aria-current]="seccionActiva() === 'solicitudes' ? 'page' : null" (click)="irA('/revisiones')"><ion-icon name="document-text-outline" aria-hidden="true"></ion-icon><span>Solicitudes</span></button>
              @let porRevisar = solicitudesPorRevisar();
              @if (porRevisar !== null && porRevisar > 0) {
                <span class="gh-nav__contador" [attr.aria-label]="porRevisar + ' solicitudes por revisar'">{{ porRevisar }}</span>
              }
            </li>
            <li class="gh-nav__item">
              <button type="button" class="gh-nav__enlace" [attr.aria-current]="seccionActiva() === 'practicas' ? 'page' : null" (click)="irA('/practicas')"><ion-icon name="folder-open-outline" aria-hidden="true"></ion-icon><span>Prácticas</span></button>
            </li>
            <li class="gh-nav__item">
              <button type="button" class="gh-nav__enlace" [attr.aria-current]="seccionActiva() === 'estados' ? 'page' : null" (click)="irA('/gestion-estados')"><ion-icon name="options-outline" aria-hidden="true"></ion-icon><span>Estados</span></button>
            </li>
          </ul>
        </li>

        <li class="gh-nav__grupo" data-grupo="acompanamiento" [class.gh-nav__grupo--activo]="grupoActivo() === 'acompanamiento'">
          <span class="gh-nav__titulo" id="gh-grupo-acompanamiento">Acompañamiento</span>
          <ul class="gh-nav" aria-labelledby="gh-grupo-acompanamiento">
            <li class="gh-nav__item">
              <button type="button" class="gh-nav__enlace" [attr.aria-current]="seccionActiva() === 'seguimientos' ? 'page' : null" (click)="irA('/seguimientos')"><ion-icon name="pulse-outline" aria-hidden="true"></ion-icon><span>Seguimientos</span></button>
            </li>
            <li class="gh-nav__item">
              <button type="button" class="gh-nav__enlace" [attr.aria-current]="seccionActiva() === 'incidencias' ? 'page' : null" (click)="irA('/incidencias')"><ion-icon name="warning-outline" aria-hidden="true"></ion-icon><span>Incidencias</span></button>
            </li>
          </ul>
        </li>

        <li class="gh-nav__grupo" data-grupo="comunicaciones" [class.gh-nav__grupo--activo]="grupoActivo() === 'comunicaciones'">
          <span class="gh-nav__titulo" id="gh-grupo-comunicaciones">Comunicaciones</span>
          <ul class="gh-nav" aria-labelledby="gh-grupo-comunicaciones">
            <li class="gh-nav__item">
              <button type="button" class="gh-nav__enlace" [attr.aria-current]="seccionActiva() === 'avisos' ? 'page' : null" (click)="irA('/envio-notificaciones')"><ion-icon name="paper-plane-outline" aria-hidden="true"></ion-icon><span>Avisos</span></button>
            </li>
          </ul>
        </li>
      </ul>
    </nav>
  </aside>

  @if (menuMovilAbierto()) {
    <div class="gh-velo" aria-hidden="true" (click)="cerrarMenuMovil()"></div>
  }

  <div class="gh-principal">
    <header class="gh-topbar">
      <button
        #botonMenuMovil
        type="button"
        class="gh-menu"
        aria-controls="gh-sidebar"
        [attr.aria-expanded]="menuMovilAbierto()"
        (click)="alternarMenuMovil()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <span>Menú</span>
      </button>

      <div class="gh-herramientas">
        @if (tieneEspacioEstudiante()) {
          <button type="button" class="gh-cambio" (click)="irAEspacioEstudiante()">Mi práctica</button>
        }
        <button type="button" class="gh-campana" [class.gh-campana--activa]="seccionActiva() === 'notificaciones'" [attr.aria-current]="seccionActiva() === 'notificaciones' ? 'page' : null" aria-label="Abrir notificaciones" (click)="abrirNotificaciones()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
            <path d="M10 21h4" />
          </svg>
          @if (notificacionesNoLeidas() > 0) {
            <span class="gh-campana__cuenta">{{ notificacionesNoLeidas() }}</span>
          }
        </button>

        <div class="gh-cuenta" #cuenta>
          <button
            type="button"
            class="gh-cuenta__alternar"
            aria-controls="gh-cuenta-menu"
            [attr.aria-expanded]="menuCuentaAbierto()"
            (click)="alternarMenuCuenta()">
            <span class="gh-avatar" aria-hidden="true">{{ inicial() }}</span>
            <span class="gh-cuenta__nombre">{{ nombre() }}</span>
            <svg class="gh-chevron" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          @if (menuCuentaAbierto()) {
            <div class="gh-cuenta__menu" id="gh-cuenta-menu">
              <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
            </div>
          }
        </div>
      </div>
    </header>

    <div class="gh-area">
      <ng-content />
    </div>
  </div>
</div>
